<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈氏家族 - 首页</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .search-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box input {
            padding: 10px 16px;
            border: 1px solid rgba(91, 70, 54, 0.3);
            border-radius: 24px;
            width: 240px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--color-text);
            transition: all 0.25s;
            font-family: var(--font-serif);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(160, 82, 45, 0.15);
            width: 280px;
        }

        .search-box button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--color-primary);
            color: var(--color-bg);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box button:hover {
            background: var(--color-accent);
            transform: scale(1.08);
        }

        .birthday-badge {
            background: linear-gradient(135deg, #fff4d6, #ffe3a3);
            border: 1px solid var(--color-gold);
            border-radius: 24px;
            padding: 8px 18px;
            font-size: 14px;
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: var(--shadow-sm); }
            50% { box-shadow: 0 0 12px rgba(212, 168, 75, 0.5); }
        }

        .birthday-badge .bd-title {
            font-weight: 600;
            color: var(--color-accent);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            margin: 30px auto 40px;
            max-width: 1200px;
            padding: 0 24px;
        }

        .member-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 12px 16px;
            background: var(--color-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: var(--color-text);
            transition: all 0.3s cubic-bezier(.4,0,.2,1);
            border: 1px solid rgba(91, 70, 54, 0.08);
            position: relative;
            overflow: hidden;
        }

        .member-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            background: var(--color-card-hover);
        }

        .member-card:hover::before {
            opacity: 1;
        }

        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-accent));
            color: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(160, 82, 45, 0.3);
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 4px;
        }

        .member-meta {
            font-size: 12px;
            color: var(--color-text-soft);
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .member-gen {
            background: var(--color-primary-light);
            color: var(--color-bg);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        .stats-bar {
            max-width: 1200px;
            margin: 20px auto 0;
            padding: 0 24px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--color-card);
            padding: 10px 22px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-align: center;
            border: 1px solid rgba(91, 70, 54, 0.08);
        }

        .stat-num {
            font-size: 22px;
            font-weight: bold;
            color: var(--color-accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--color-text-soft);
        }

        @media (max-width: 768px) {
            .search-wrap {
                justify-content: center;
                margin-top: 16px;
            }
            .container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .container { grid-template-columns: repeat(2, 1fr); }
            .search-box input { width: 180px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">陈氏家族</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="ls.html">家族历史</a></li>
                <li><a href="zp.html">关系图谱</a></li>
                <li><a href="lt.html">家族论坛</a></li>
            </ul>
        </div>
    </nav>

    <h1 class="page-title">陈氏家族成员</h1>

    <div class="search-wrap">
        <div class="search-box">
            <button id="searchToggle" title="搜索">🔍</button>
            <input type="text" id="searchInput" placeholder="按姓名查找..." style="display:none;">
        </div>
        <div id="birthdayWrap"></div>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="container" id="familyContainer">
        <div class="loading">加载中...</div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 陈氏家族 版权所有</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const cnNum = { '零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'冬':11,'腊':12 };

        function parseChineseDate(dateStr) {
            if (!dateStr) return null;
            dateStr = dateStr.trim();
            if (!dateStr) return null;
            let month = null, day = null;
            if (dateStr.startsWith('正')) { month = 1; dateStr = dateStr.substring(1); }
            else if (dateStr.startsWith('冬')) { month = 11; dateStr = dateStr.substring(1); }
            else if (dateStr.startsWith('腊')) { month = 12; dateStr = dateStr.substring(1); }
            else {
                const yueIdx = dateStr.indexOf('月');
                if (yueIdx !== -1) {
                    const monthStr = dateStr.substring(0, yueIdx);
                    dateStr = dateStr.substring(yueIdx + 1);
                    if (monthStr === '十') month = 10;
                    else if (monthStr.startsWith('十')) month = 10 + (cnNum[monthStr[1]] || 0);
                    else month = cnNum[monthStr[0]] || parseInt(monthStr) || null;
                }
            }
            if (dateStr) {
                let n = parseInt(dateStr);
                if (!isNaN(n)) day = n;
                else {
                    if (dateStr === '十') day = 10;
                    else if (dateStr.startsWith('初')) {
                        const rest = dateStr.substring(1);
                        day = rest === '十' ? 10 : (cnNum[rest] !== undefined ? cnNum[rest] : null);
                    } else if (dateStr.startsWith('十')) {
                        const rest = dateStr.substring(1);
                        day = 10 + (cnNum[rest] !== undefined ? cnNum[rest] : 0);
                    } else if (dateStr.startsWith('二十')) {
                        const rest = dateStr.substring(2);
                        day = 20 + (cnNum[rest] !== undefined ? cnNum[rest] : 0);
                    } else if (dateStr.startsWith('三十')) {
                        day = 30;
                    }
                }
            }
            if (month && day) return { month, day };
            return null;
        }

        // 直接使用内联数据，支持双击 file:// 打开
        (function() {
            const data = familyData;
            renderStats(data);
            renderMembers(data);
            checkBirthdays(data);
        })();

        function renderStats(data) {
            const total = data.length;
            const gens = [...new Set(data.map(m => m['代数']).filter(Boolean))].length;
            const alive = data.filter(m => !m['终年'] || m['终年'] === 0).length;
            document.getElementById('statsBar').innerHTML =
                '<div class="stat-item"><div class="stat-num">' + total + '</div><div class="stat-label">家族总人数</div></div>' +
                '<div class="stat-item"><div class="stat-num">' + gens + '</div><div class="stat-label">传承世代</div></div>' +
                '<div class="stat-item"><div class="stat-num">' + alive + '</div><div class="stat-label">在世人数</div></div>';
        }

        function renderMembers(data) {
            const container = document.getElementById('familyContainer');
            container.innerHTML = '';
            data.sort((a, b) => (a['出生年份'] || 0) - (b['出生年份'] || 0));

            data.forEach(m => {
                const card = document.createElement('a');
                card.href = 'cgf2.html?id=' + m.ID;
                card.className = 'member-card';
                card.dataset.name = m['姓名'] || '';

                const initial = m['姓名'] ? m['姓名'].charAt(0) : '?';
                const gen = m['代数'] ? '第' + m['代数'] + '代' : '';
                const born = m['出生年份'] || '';

                card.innerHTML =
                    '<div class="member-avatar">' + initial + '</div>' +
                    '<div class="member-name">' + (m['姓名'] || '') + '</div>' +
                    '<div class="member-meta">' +
                        (gen ? '<span class="member-gen">' + gen + '</span>' : '') +
                        (born ? '<span>' + born + '年</span>' : '') +
                    '</div>';
                container.appendChild(card);
            });
        }

        function checkBirthdays(data) {
            const wrap = document.getElementById('birthdayWrap');
            const today = new Date();
            const curMonth = today.getMonth() + 1;
            const curDay = today.getDate();

            const names = [];
            data.forEach(m => {
                const bd = parseChineseDate(m['生日']);
                if (bd && bd.month === curMonth && bd.day === curDay) names.push(m['姓名']);
            });

            if (names.length > 0) {
                wrap.innerHTML = '<div class="birthday-badge">🎂 <span class="bd-title">今日寿星：</span>' + names.join('、') + '</div>';
            }
        }

        document.getElementById('searchToggle').addEventListener('click', function() {
            const input = document.getElementById('searchInput');
            if (input.style.display === 'none' || !input.style.display) {
                input.style.display = 'inline-block';
                input.focus();
            } else {
                input.style.display = 'none';
            }
        });

        document.getElementById('searchInput').addEventListener('keyup', function() {
            const f = this.value.toLowerCase();
            document.querySelectorAll('#familyContainer .member-card').forEach(c => {
                c.style.display = c.dataset.name.toLowerCase().includes(f) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
