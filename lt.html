<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈氏论坛</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .forum-wrap {
            max-width: 800px;
            margin: 30px auto 40px;
            padding: 0 24px;
        }

        .forum-title-sub {
            text-align: center;
            color: var(--color-text-soft);
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forum-card {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 22px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            border: 1px solid rgba(91, 70, 54, 0.08);
        }

        .forum-card h3 {
            font-size: 17px;
            color: var(--color-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .forum-card h3::before {
            content: '';
            width: 4px; height: 16px;
            background: var(--color-gold);
            border-radius: 2px;
        }

        .input-row { margin-bottom: 14px; }
        .input-row label { display: block; font-size: 13px; color: var(--color-text-soft); margin-bottom: 6px; }

        .forum-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(91, 70, 54, 0.2);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-family: var(--font-serif);
            transition: all 0.25s;
        }
        .forum-input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(160, 82, 45, 0.15);
        }
        #message-input { height: 110px; resize: vertical; }

        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font-serif);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--color-primary); color: var(--color-bg); }
        .btn-primary:hover { background: var(--color-accent); transform: translateY(-1px); }
        .btn-secondary { background: var(--color-bg-light); color: var(--color-primary); border: 1px solid rgba(91, 70, 54, 0.2); }
        .btn-secondary:hover { background: var(--color-gold); color: var(--color-bg); }

        .section-title {
            font-size: 17px;
            color: var(--color-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .post-list { display: flex; flex-direction: column; gap: 14px; }

        .post-item {
            padding: 16px 18px;
            background: var(--color-bg-light);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(91, 70, 54, 0.08);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-accent));
            color: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .post-meta { flex: 1; }
        .post-name { font-weight: 600; color: var(--color-primary); font-size: 15px; }
        .post-time { font-size: 12px; color: var(--color-text-soft); }
        .post-content {
            padding-left: 50px;
            color: var(--color-text);
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--color-text-soft);
        }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        @media (max-width: 480px) {
            .forum-card { padding: 16px; }
            .post-content { padding-left: 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">陈氏家族</a>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="ls.html">家族历史</a></li>
                <li><a href="zp.html">关系图谱</a></li>
                <li><a href="lt.html" class="active">家族论坛</a></li>
            </ul>
        </div>
    </nav>

    <h1 class="page-title">陈氏家族论坛</h1>
    <p class="forum-title-sub">陈家人的专属讨论区</p>

    <div class="forum-wrap">
        <div class="forum-card">
            <h3>发表新帖</h3>
            <div class="input-row">
                <label>您的昵称（必须以"陈"开头）</label>
                <input type="text" id="username-input" class="forum-input" placeholder="如：陈老三">
            </div>
            <div class="input-row">
                <label>发言内容</label>
                <textarea id="message-input" class="forum-input" placeholder="在这里输入您的发言...（Enter 发送，Shift+Enter 换行）"></textarea>
            </div>
            <div class="btn-row">
                <button id="send-btn" class="btn btn-primary">发表</button>
                <button id="refresh-btn" class="btn btn-secondary">刷新帖子</button>
            </div>
        </div>

        <div class="forum-card">
            <div class="section-title">
                <span>💬 论坛帖子 <small id="postCount" style="color:var(--color-text-soft);font-weight:normal;"></small></span>
            </div>
            <div id="postList" class="post-list"><div class="empty-state"><div class="emoji">📝</div><p>正在加载帖子...</p></div></div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 陈氏家族 版权所有</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const KEY = 'chen_forum_posts';
        document.addEventListener('DOMContentLoaded', function() {
            const nameIn = document.getElementById('username-input');
            const msgIn = document.getElementById('message-input');
            const send = document.getElementById('send-btn');
            const refresh = document.getElementById('refresh-btn');
            const list = document.getElementById('postList');

            loadPosts();

            send.addEventListener('click', function() {
                const name = nameIn.value.trim();
                const text = msgIn.value.trim();
                if (!name) { alert('请输入昵称'); return; }
                if (!text) { alert('请输入发言内容'); return; }
                if (!name.startsWith('陈')) { alert('昵称必须以"陈"开头！'); return; }

                const post = { username: name, text, time: new Date().toLocaleString(), id: Date.now() };
                renderPost(post, true);
                msgIn.value = '';
                savePost(post);
            });

            refresh.addEventListener('click', loadPosts);

            msgIn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
            });

            function renderPost(post, prepend) {
                const empty = list.querySelector('.empty-state');
                if (empty) empty.remove();
                const item = document.createElement('div');
                item.className = 'post-item';
                item.innerHTML =
                    '<div class="post-header">' +
                        '<div class="avatar">' + post.username.charAt(0) + '</div>' +
                        '<div class="post-meta">' +
                            '<div class="post-name">' + escapeHtml(post.username) + '</div>' +
                            '<div class="post-time">' + post.time + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="post-content">' + escapeHtml(post.text) + '</div>';
                if (prepend) list.prepend(item); else list.appendChild(item);
                updateCount();
            }

            function savePost(post) {
                let posts = [];
                try { posts = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}
                posts.push(post);
                localStorage.setItem(KEY, JSON.stringify(posts));
            }

            function loadPosts() {
                list.innerHTML = '<div class="empty-state"><div class="emoji">📝</div><p>正在加载帖子...</p></div>';
                let posts = [];
                try { posts = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}

                if (posts.length === 0) {
                    // 直接使用内联的初始论坛数据，支持双击 file:// 打开
                    if (typeof forumPostData !== 'undefined' && forumPostData.length > 0) {
                        posts = forumPostData;
                        localStorage.setItem(KEY, JSON.stringify(posts));
                    }
                    showPosts(posts);
                } else {
                    showPosts(posts);
                }
            }

            function showPosts(posts) {
                if (posts.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="emoji">🌱</div><p>暂无帖子，快来发表第一条吧！</p></div>';
                    return;
                }
                list.innerHTML = '';
                posts.forEach(p => renderPost(p, false));
                updateCount();
            }

            function updateCount() {
                const c = list.querySelectorAll('.post-item').length;
                document.getElementById('postCount').textContent = c ? '（共 ' + c + ' 条）' : '';
            }

            function escapeHtml(s) {
                if (s === null || s === undefined) return '';
                return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }
        });
    </script>
</body>
</html>
