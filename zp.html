<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈氏家族关系图谱</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-title { margin: 24px auto 0; }

        .toolbar {
            max-width: 1200px;
            margin: 16px auto;
            padding: 0 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar input {
            padding: 10px 18px;
            border: 1px solid rgba(91, 70, 54, 0.3);
            border-radius: 24px;
            width: 260px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-family: var(--font-serif);
            transition: all 0.25s;
        }
        .toolbar input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(160, 82, 45, 0.15);
        }

        .toolbar button {
            padding: 10px 22px;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            font-family: var(--font-serif);
            transition: all 0.2s;
        }
        .toolbar button:hover { background: var(--color-accent); transform: translateY(-1px); }

        .view-switch {
            display: flex;
            gap: 6px;
            background: var(--color-bg-light);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid rgba(91, 70, 54, 0.15);
        }
        .view-switch a {
            padding: 6px 14px;
            text-decoration: none;
            color: var(--color-text-soft);
            border-radius: 16px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .view-switch a.active {
            background: var(--color-primary);
            color: var(--color-bg);
        }

        .tree-scroll {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            padding: 10px 24px 30px;
            -webkit-overflow-scrolling: touch;
        }

        .family-tree {
            display: inline-block;
            min-width: 100%;
        }

        .member-node {
            display: inline-block;
            text-align: center;
            vertical-align: top;
            margin: 0 4px;
            position: relative;
            padding-top: 16px;
        }

        .member-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            padding: 4px 6px;
            font-size: 14px;
            position: relative;
            z-index: 2;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(91, 70, 54, 0.12);
            color: var(--color-primary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 28px;
            box-sizing: border-box;
            line-height: 1;
        }

        .member-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            background: var(--color-card-hover);
            color: var(--color-accent);
        }

        .member-card.gen-1 { background: linear-gradient(135deg, #fff9e6, #ffe9b8); border-color: var(--color-gold); font-weight: bold; }
        .member-card.highlight {
            background: linear-gradient(135deg, #fff176, #ffb74d) !important;
            box-shadow: 0 0 16px rgba(255, 193, 7, 0.6) !important;
            font-weight: bold;
            transform: scale(1.08);
        }

        .vertical-connector {
            position: absolute;
            width: 0; height: 10px;
            top: 0; left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 10px solid var(--color-primary-light);
        }

        .horizontal-connector {
            position: absolute;
            height: 1.5px;
            background: var(--color-primary-light);
            top: 10px;
            left: 0; right: 0;
            z-index: 1;
        }

        .children-container {
            display: flex;
            justify-content: center;
            position: relative;
            padding-top: 16px;
        }

        .sibling-group { display: inline-flex; position: relative; }

        .loading-tree { text-align: center; color: var(--color-primary-light); padding: 60px 20px; }

        @media (max-width: 768px) {
            .member-card { font-size: 13px; padding: 5px 8px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">陈氏家族</a>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="ls.html">家族历史</a></li>
                <li><a href="zp.html" class="active">关系图谱</a></li>
                <li><a href="lt.html">家族论坛</a></li>
            </ul>
        </div>
    </nav>

    <h1 class="page-title">陈氏家族关系图谱</h1>

    <div class="toolbar">
        <div class="view-switch">
            <a href="zp.html" class="active">横版</a>
            <a href="zp2.html">竖版</a>
        </div>
        <input type="text" id="searchInput" placeholder="🔍 输入姓名搜索，如 陈氏">
        <button id="searchBtn">搜索</button>
    </div>

    <div class="tree-scroll">
        <div class="family-tree" id="familyTree">
            <div class="loading-tree">加载中...</div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 陈氏家族 版权所有</p>
    </footer>

    <script src="data.js"></script>
    <script>
        (function() {
            const data = familyData;
            const tree = buildTree(data); render(tree);
        })();

        function buildTree(data) {
            const m = {}; data.forEach(x => { m[x.ID] = { ...x, children: [] }; });
            const tree = [];
            Object.values(m).forEach(x => {
                if (!x['父亲ID'] || !m[x['父亲ID']]) tree.push(x);
                else m[x['父亲ID']].children.push(x);
            });
            return tree;
        }

        function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function renderNode(n, lv) {
            const hasC = n.children && n.children.length > 0;
            let h = '<div class="member-node" data-lv="' + lv + '">';
            if (lv > 0) h += '<div class="vertical-connector"></div>';
            h += '<div class="member-card gen-' + (n['代数'] || 0) + '" data-id="' + n.ID + '" data-name="' + esc(n['姓名']) + '">' + esc(n['姓名']) + '</div>';
            if (hasC) {
                h += '<div class="children-container"><div class="horizontal-connector"></div><div class="sibling-group">';
                n.children.forEach(c => h += renderNode(c, lv + 1));
                h += '</div></div>';
            }
            h += '</div>';
            return h;
        }

        function render(tree) {
            const el = document.getElementById('familyTree');
            el.innerHTML = tree.map(r => renderNode(r, 0)).join('');
            document.querySelectorAll('.member-card').forEach(c => {
                c.addEventListener('click', () => location.href = 'cgf2.html?id=' + c.dataset.id);
            });
            // 确保 layout 稳定后再调整：rAF 双帧 + 多次 setTimeout + load 事件
            requestAnimationFrame(() => { requestAnimationFrame(adj); });
            setTimeout(adj, 150);
            setTimeout(adj, 400);
            setTimeout(adj, 900);
            if (document.readyState === 'complete') {
                adj();
            } else {
                window.addEventListener('load', adj);
            }
            window.addEventListener('resize', adj);
        }

        function adj() {
            document.querySelectorAll('.children-container').forEach(cc => {
                const sg = cc.querySelector('.sibling-group');
                const conn = cc.querySelector('.horizontal-connector');
                if (!sg || !conn) return;

                // === 独子：隐藏横线，保留三角箭头 ===
                if (sg.children.length <= 1) {
                    conn.style.display = 'none';
                    return;
                }

                // === 多子：计算横线起止 ===
                conn.style.display = '';
                const fc = sg.firstElementChild, lc = sg.lastElementChild;
                if (!fc || !lc) return;
                const fr = fc.getBoundingClientRect(), lr = lc.getBoundingClientRect(), cr = cc.getBoundingClientRect();
                const startX = fr.left + fr.width/2 - cr.left;
                const endX = lr.left + lr.width/2 - cr.left;
                conn.style.left = startX + 'px';
                conn.style.width = (endX - startX) + 'px';
            });
        }

        document.getElementById('searchBtn').addEventListener('click', search);
        document.getElementById('searchInput').addEventListener('keyup', e => { if (e.key === 'Enter') search(); });
        function search() {
            const t = document.getElementById('searchInput').value.trim().toLowerCase();
            document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
            if (!t) return;
            const matches = Array.from(document.querySelectorAll('.member-card')).filter(c => c.dataset.name.toLowerCase().includes(t));
            if (matches.length === 0) { alert('未找到匹配成员'); return; }
            matches.forEach(m => m.classList.add('highlight'));
            matches[0].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
    </script>
</body>
</html>
